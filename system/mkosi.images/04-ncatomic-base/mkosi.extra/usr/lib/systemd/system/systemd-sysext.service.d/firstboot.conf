[Unit]
ConditionPathExists=|!/etc/extensions

[Service]
ExecStartPre=/usr/bin/bash -c '[[ -f /etc/verity.d/mkosi.crt ]] || { \
 mkdir -p /etc/verity.d; \
 /usr/bin/openssl x509 -in /boot/EFI/mkosi.der -out /etc/verity.d/mkosi.crt -outform PEM; \
}'
ExecStartPre=/usr/bin/bash -c '[[ -d /etc/extensions ]] || { \
 mkdir -p /etc/extensions /var/lib/extensions; \
 for ext in /usr/share/ncatomic/seed/extensions/*.tar.*; \
 do \
  [[ "$${ext}" == "/usr/share/ncatomic/seed/extensions/*.tar.*" ]] || { \
   ext_name="$(basename "$${ext}")"; \
   extracted="$(tar -tf "$${ext}" | head -n1)"; \
   tar -xf "$${ext}" -C /var/lib/extensions; \
   ln -s "/var/lib/extensions/$${extracted}" "/etc/extensions/$${extracted/_*_*./.}"; \
  }; \
 done; \
}'
ExecStartPost=/usr/bin/systemctl preset-all
ExecStartPost=/usr/bin/systemctl daemon-reload
#ExecStartPost=/usr/bin/systemctl restart ncatomic.target
