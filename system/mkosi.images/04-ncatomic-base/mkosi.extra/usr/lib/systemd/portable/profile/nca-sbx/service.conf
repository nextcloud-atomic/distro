[Service]
MountAPIVFS=yes
PrivateTmp=yes
BindReadOnlyPaths=/etc/machine-id

# Mount systemd-resolve config directly (avoids symlinks to /run//)
BindReadOnlyPaths=/run/systemd/resolve/stub-resolv.conf:/etc/resolv.conf

BindLogSockets=yes

# Tmpfs for writeable paths <-> overwrite with BindPaths where needed
TemporaryFileSystem=/etc
TemporaryFileSystem=/run/
TemporaryFileSystem=/var

RemoveIPC=yes
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER \
        CAP_FSETID CAP_IPC_LOCK CAP_IPC_OWNER CAP_KILL CAP_MKNOD CAP_NET_ADMIN \
        CAP_NET_BIND_SERVICE CAP_NET_BROADCAST CAP_SETGID CAP_SETPCAP \
        CAP_SETUID CAP_SYS_ADMIN CAP_SYS_CHROOT CAP_SYS_NICE CAP_SYS_RESOURCE

PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes

RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictNamespaces=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native

# Root sandbox (no user mapping / dynamic user)
DynamicUser=yes
PrivateUsers=yes